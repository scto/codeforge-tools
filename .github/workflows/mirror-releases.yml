name: Mirror HomuHomu833 Releases

# Spiegelt die Releases von HomuHomu833 (android-sdk-custom, android-ndk-custom, cmake-custom)
# als Release-Assets in dieses Repo. Läuft manuell und wöchentlich (neue Upstream-Versionen).
# Idempotent: vorhandene Assets werden übersprungen, ein abgebrochener Lauf kann wiederholt werden.
# Kein PAT nötig: der Standard-GITHUB_TOKEN darf in das eigene Repo schreiben (contents: write).

on:
  workflow_dispatch:
    inputs:
      components:
        description: "Komponenten, durch Komma getrennt (sdk, ndk, cmake)"
        required: true
        default: "sdk,ndk,cmake"
        type: string
      versions:
        description: "Nur diese Release-Namen/Tags, durch Komma getrennt (leer = alle), z. B. r29,3.22.1,37.0.0"
        required: false
        default: ""
        type: string
      variants:
        description: "Asset-Varianten, durch Komma getrennt"
        required: true
        default: "aarch64-linux-android"
        type: string
      dry_run:
        description: "Nur anzeigen, nichts anlegen oder hochladen"
        required: true
        default: true
        type: boolean
      force:
        description: "Vorhandene Assets neu hochladen"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"   # montags 03:17 UTC; Zeitplan-Läufe sind echte Läufe (dry_run=false)

permissions:
  contents: write

concurrency:
  group: mirror-releases
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub-Limit pro Job: 360 Minuten

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spiegeln
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          # Bei schedule sind inputs leer -> Standardwerte des Scripts bzw. echter Lauf
          COMPONENTS: ${{ inputs.components || 'sdk,ndk,cmake' }}
          VERSIONS: ${{ inputs.versions }}
          VARIANTS: ${{ inputs.variants || 'aarch64-linux-android' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: bash scripts/mirror-releases.sh
