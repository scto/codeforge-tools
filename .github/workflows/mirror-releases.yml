name: Mirror HomuHomu833/android-sdk-custom/ AndroidIDEOfficial/androidide-tools/ Lzhiyong/android-sdk-tools/ msmt2018/android-sdk-tools Releases

# Spiegelt Android-Toolchains als Release-Assets in dieses Repo:
#   sdk, ndk, cmake  HomuHomu833/android-sdk-custom, android-ndk-custom, cmake-custom
#   aide             AndroidIDEOfficial/androidide-tools (Build-/Platform-Tools 33.x/34.x, statisch)
#   lzhi             Lzhiyong/android-sdk-tools (35.0.2 u. a., statisch, nur Binaries)
#   msmt             msmt2018/android-sdk-tools (platform-tools-<V>: vollständige build-/platform-tools je ABI, mit Jars)
# Läuft manuell und wöchentlich (neue Upstream-Versionen). Danach wird catalog.json neu erzeugt (schneller SDK-Manager).
# Idempotent: vorhandene Assets werden übersprungen, ein abgebrochener Lauf kann wiederholt werden.
# Kein PAT nötig: der Standard-GITHUB_TOKEN darf in das eigene Repo schreiben (contents: write).

on:
  workflow_dispatch:
    inputs:
      components:
        description: "Komponenten, durch Komma getrennt (sdk, ndk, cmake, aide, lzhi, msmt)"
        required: true
        default: "sdk,ndk,cmake,aide,lzhi,msmt"
        type: string
      versions:
        description: "Nur diese Release-Namen/Tags, durch Komma getrennt (leer = alle), z. B. r29,3.22.1,37.0.0"
        required: false
        default: ""
        type: string
      variants:
        description: "Varianten für sdk/ndk/cmake, durch Komma getrennt"
        required: true
        default: "aarch64-linux-android,armv7a-linux-androideabi"
        type: string
      aide_variants:
        description: "Varianten für aide (androidide-tools)"
        required: true
        default: "aarch64,arm"
        type: string
      lzhi_variants:
        description: "Varianten für lzhi (Lzhiyong/android-sdk-tools)"
        required: true
        default: "aarch64,arm"
        type: string
      msmt_variants:
        description: "Varianten für msmt (msmt2018/android-sdk-tools, ABI-Namen)"
        required: true
        default: "arm64-v8a,armeabi-v7a"
        type: string
      include_prerelease:
        description: "Auch Beta-/RC-Releases spiegeln (Standard: nein)"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Nur anzeigen, nichts anlegen oder hochladen"
        required: true
        default: true
        type: boolean
      force:
        description: "Vorhandene Assets neu hochladen"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"   # montags 03:17 UTC; Zeitplan-Läufe sind echte Läufe (dry_run=false)

permissions:
  contents: write

concurrency:
  group: mirror-releases
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub-Limit pro Job: 360 Minuten

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Spiegeln
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          # Bei schedule sind inputs leer -> Standardwerte des Scripts bzw. echter Lauf
          COMPONENTS: ${{ inputs.components || 'sdk,ndk,cmake,aide,lzhi,msmt' }}
          VERSIONS: ${{ inputs.versions }}
          VARIANTS: ${{ inputs.variants || 'aarch64-linux-android,armv7a-linux-androideabi' }}
          AIDE_VARIANTS: ${{ inputs.aide_variants || 'aarch64,arm' }}
          LZ_VARIANTS: ${{ inputs.lzhi_variants || 'aarch64,arm' }}
          MS_VARIANTS: ${{ inputs.msmt_variants || 'arm64-v8a,armeabi-v7a' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          INCLUDE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_prerelease || 'false' }}
        run: bash scripts/mirror-releases.sh

      # Katalog auch nach einem Teilfehler neu bauen (neue Releases sollen sofort im SDK-Manager stehen)
      - name: Katalog aktualisieren
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: bash scripts/build-catalog.sh --commit
